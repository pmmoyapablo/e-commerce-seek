server:
  port: 8000

eureka:
  client:
    serviceUrl:
      defaultZone: http://eureka-server:8080/eureka/      #http://localhost:8080/eureka/
    #register-with-eureka: true
    #fetch-registry: true
  instance:
    prefer-ip-address: true
    #hostname: localhost

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: accountService
          uri: lb://ACCOUNT-SERVICE
          predicates:
            - Path=/account-service/accounts/***,/account-service/accounts,/account-service/token/generate
            - Method=GET,POST
        - id: transactionService1
          uri: lb://TRANSACTION-SERVICE
          predicates:
            - Path=/transaction-service/transactions/***
            - Method=GET
        - id: transactionService2
          uri: lb://TRANSACTION-SERVICE
          predicates:
            - Path=/transaction-service/transactions
            - Method=POST
          #filters:
            #- name: PreValidation
              #args:
                #validationServiceName: ACCOUNT-SERVICE
                #validationEndpoint: /account-service/accounts/validate
                #headerName: X-Validation-Data
                #validationMethod: POST

# Logging (útil para depurar)
logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    reactor.netty.http.client: DEBUG
    com.vectora.bank.gateway.api.PreValidationGatewayFilterFactory: INFO

#Actuator
management:
  endpoints:
    jmx:
      exposure:
        include: health,info,env,beans
    web:
      exposure:
        include: health,info,env,beans